# Déploiement SouverainRecrut Backend + PostgreSQL (§5.2)
#
# Sur le serveur, dans /opt/souverainrecrut (avec un fichier .env créé
# à partir de .env.example, jamais versionné) :
#   docker compose pull
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f
#
# L'image Backend est celle publiée sur Docker Hub par Jenkins : elle n'est
# jamais reconstruite ici.
#
# Migrations Prisma : le service "migrate" applique uniquement les migrations
# versionnées dans l'image (prisma migrate deploy), une seule fois, après que
# PostgreSQL est prêt et avant le démarrage de l'API. Si une migration échoue,
# l'API ne démarre pas.

name: souverainrecrut

x-backend-image: &backend-image ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME manquant}/souverainrecrut-backend:${IMAGE_TAG:?IMAGE_TAG manquant}
x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

services:
  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: *backend-image
    # CLI Prisma de la même version que @prisma/client (absent de l'image de production)
    command: ["npx", "--yes", "prisma@6.16.2", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  backend:
    image: *backend-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      API_VERSION: v1
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    healthcheck:
      # /v1/ready répond 200 uniquement si l'API joint PostgreSQL
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:

networks:
  backend:
