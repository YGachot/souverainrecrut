# Paramètres d'analyse SonarQube - backend SouverainRecrut
# L'URL du serveur et le token ne sont PAS ici : ils sont fournis
# au moment de l'analyse (variables d'environnement / credentials Jenkins).

sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut Backend

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Rapport de couverture produit par : npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mêmes exclusions de couverture que jest.config.js
sonar.coverage.exclusions=src/server.ts,src/docs/**,src/types/**

# src/docs/ = définitions Swagger (données déclaratives, structure
# identique par ressource) : exclues de la détection de duplication
sonar.cpd.exclusions=src/docs/**
